[workspace]
name = "cbp-python"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.14.0,<3.15"
pip = "*"
ruff = ">=0.14.7,<0.15"
pytest = ">=9.0.1,<10"
typer = ">=0.20.0,<0.21"
rich = ">=14.2.0,<15"
pydantic = ">=2.12.5,<3"

[pypi-dependencies]
rich = { version = "*", extras = ["all"] }
# Add real PyPI deps here later, e.g.
# requests = "*"
# pandas = "*"

[tasks]
test = "pytest -v"

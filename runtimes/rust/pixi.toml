[workspace]
name = "cbp-rust"
version = "0.1.0"
description = "Add a short description here"
authors = ["Peter Alexander <makeroftools@creativedevelopment.systems>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
rust = ">=1.91.1,<1.92"
rust-src = ">=1.91.1,<2"
openssl = ">=3.6.0,<4"
# jinja2 = ">=3.1.6,<4"

# [pypi-dependencies]
# jinja2 = "*"
# typer = { version = ">=0.20.0, <0.21", extras = ["all"] }

[tasks]
build = "cargo build --target x86_64-unknown-linux-gnu |& tee build.log"
start = "cargo run"
test = "cargo test"
clean = "cargo clean"
fmt = "cargo fmt"
lint = { cmd = "cargo clippy", depends-on = ["fmt"] }

[tasks.add]
args = [{"arg" = "rust_package"},{ "arg" = "features", default = ""}]
cmd = "cargo add {arg} {features}||cargo add {arg} {features} --pypi"


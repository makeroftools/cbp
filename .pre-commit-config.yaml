repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # Use latest stable
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]

  - repo: https://github.com/jeremyephron/pre-commit-git-submodule
    rev: v1.0.0
    hooks:
      - id: submodule-status

  - repo: local
    hooks:
      - id: check-submodules
        name: Check submodule status
        entry: ./check_submodules.sh
        language: script
        pass_filenames: false
        always_run: true
      # 
      # - id: update-submodules
      #   name: Update submodules
      #   entry: ./update_submodules.sh
      #   language: script
      #   pass_filenames: false
      # 
      # 
      # - id: sync-branch
      #   name: Sync submodules to main branch
      #   entry: ./sync_branches.sh main
      #   language: script
      #   pass_filenames: false
      #   always_run: true
      # 

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
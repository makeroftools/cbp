 [workspace]
authors = ["Peter Alexander <makeroftools@creativedevelopment.systems>"]
channels = ["conda-forge"]
name = "cbp-rust"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "cargo build --target x86_64-unknown-linux-gnu"
start = "cargo run"
test = "cargo test"
clean = "cargo clean"
fmt = "cargo fmt"
lint = { cmd = "cargo clippy", depends-on = ["fmt"] }


[dependencies]
python = ">=3.14.0,<3.15"
typer = ">=0.20.0,<0.21"
rust = ">=1.91.1,<1.92"
rust-src = ">=1.91.1,<2"

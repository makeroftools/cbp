# # pixi.toml content (not Python, but included for completeness)
# [workspace]
# authors = ["Peter Alexander <makeroftools@creativedevelopment.systems>"]
# channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
# name = "accounting"
# platforms = ["linux-64"]
# version = "0.1.0"

[project]
name = "cbp-accounting"
version = "0.1.0"
description = "CBP Accounting"

[tasks]
app = "PYTHONPATH=src python src/accounting/app.py"
tests = "PYTHONPATH=src pytest tests/ -v"
docs-build = "PYTHONPATH=src mkdocs build -f mkdocs.yml"
docs = "PYTHONPATH=src mkdocs serve -f mkdocs.yml"

[dependencies]
python = ">=3.14.0,<3.15"
typer = ">=0.20.0,<0.21"
pydantic = ">=2.12.4,<3"
polars = ">=1.35.1,<2"
pytest = ">=9.0.0,<10"
mkdocs = ">=1.6.1,<2"
mkdocs-material = ">=9.7.0,<10"
mkdocstrings = ">=0.30.1,<0.31"
mkdocs-gen-files = ">=0.5.0,<0.6"
pydantic-settings = ">=2.12.0,<3"
mkdocs-section-index = ">=0.3.10,<0.4"
mkdocstrings-python = ">=1.19.0,<2"
rich = ">=13.7.1,<14"

[pypi-dependencies]
firefly-iii-client = ">=6.4.0.0, <7"
 [workspace]
name = "cbp-rust"
version = "0.1.0"
description = "Add a short description here"
authors = ["Peter Alexander <makeroftools@creativedevelopment.systems>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64"]

[tasks]
build = "cargo build --target x86_64-unknown-linux-gnu"
start = "cargo run"
test = "cargo test"
clean = "cargo clean"
fmt = "cargo fmt"
lint = { cmd = "cargo clippy", depends-on = ["fmt"] }


[dependencies]
rust = ">=1.91.1,<1.92"
rust-src = ">=1.91.1,<2"
